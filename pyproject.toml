[project]
name = "lql"
version = "0.1.0"
description = "Long-horizon Q-learning: Accurate Value Learning with n-step Inequalities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beartype",
    "flax",
    "jax",
    "jaxtyping",
    "pytest",
    "einops",
    "tqdm>=4.67.3",
    "wandb>=0.24.2",
    "ml-collections>=1.1.0",
    "pillow>=12.1.0",
    "gymnasium>=1.2.3",
    "ogbench>=1.2.1",
    "h5py>=3.15.1",
    "distrax>=0.1.7",
    "diffusers>=0.30",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git",
    "robosuite>=1.5.1",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
media = ["wandb[media]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = ["diffusers>=0.30", "egl-probe; sys_platform == 'linux'"]

[tool.hatch.metadata]
allow-direct-references = true
